<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hoverboard Control</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="gauges">
		<div class="gauges-big">
			<canvas id="gauge-speed"></canvas>
			<div id="rpm"></div>
		</div>
		<div class="gauges-small">
			<div class="statbox">
				<div class="top">
					<div class="progress" id="progress-battery"></div>
				</div>
				<div class="bottom">
					<div class="title">Battery</div>
					<div class="stat" id="stat-battery">N/A</div>
				</div>
			</div>
			<div class="statbox">
				<div class="top">
					<div class="progress" id="progress-temp"></div>
				</div>
				<div class="bottom">
					<div class="title">Temperature</div>
					<div class="stat" id="stat-temp">N/A</div>
				</div>
			</div>
			<div class="statbox">
				<div class="top">
					<div class="progress" id="progress-rssi"></div>
				</div>
				<div class="bottom">
					<div class="title">Wi-Fi</div>
					<div class="stat" id="stat-rssi">N/A</div>
				</div>
			</div>
		</div>
	</div>

	<div class="joystick">
		<div id="joystick-base">
			<div id="joystick-handle"></div>
		</div>
		<div id="bottom-bar">
			<div id="ignition-status"></div>
			<div id="connection-status"></div>
		</div>
	</div>

	<div id="debug">
		<div class="handle"></div>
		<div class="content">
			<div class="left">
				<div class="ignition">
					<button id="ignition-value">N/A</button>
				</div>
			</div>
			<div class="right">
				<div class="row">
					<i>Motor websocket</i>
					<b id="motor-connection"></b>
				</div>
				<div class="row">
					<i>Motor latency</i>
					<b id="motor-latency"></b>
				</div>
				<div class="row">
					<i>System websocket</i>
					<b id="system-connection"></b>
				</div>
				<div class="row">
					<i>System latency</i>
					<b id="system-latency"></b>
				</div>
				<div class="row">
					<i>Connections</i>
					<b id="serial-connections"></b>
				</div>
				<div class="actions">
					<button id="pause-controls"></button>
					<button id="controls-hz"></button>
				</div>
			</div>
		</div>
	</div>

	<div id="darken"></div>
</body>

<script src="gauge.min.js"></script>
<script src="script.js"></script>
</html>
